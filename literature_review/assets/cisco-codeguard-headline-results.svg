<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Project CodeGuard reduces findings across all benchmarks</title>
  <desc id="desc">Grouped bar chart showing total static-analysis findings before and after Project CodeGuard: OWASP-style 107 to 65, SecurityEval 66 to 27, CyberSecEval 242 to 172.</desc>
  <defs>
    <pattern id="baselineHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#8fc8f4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    </pattern>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #2f3f55; }
      .axis { stroke: #d8dde5; stroke-width: 2; }
      .grid { stroke: #edf0f4; stroke-width: 1; }
      .tick { font: 14px Arial, sans-serif; fill: #2f3f55; }
      .label { font: 18px Arial, sans-serif; fill: #526b7d; }
      .value { font: 18px Arial, sans-serif; fill: #2f3f55; text-anchor: middle; }
      .legend { font: 15px Arial, sans-serif; fill: #38485c; }
      .note { font: 13px Arial, sans-serif; fill: #6e7d8b; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>
  <text class="title" x="500" y="42" text-anchor="middle">Project CodeGuard Reduces Findings Across All Benchmarks</text>

  <line class="grid" x1="100" y1="407" x2="940" y2="407"/>
  <line class="grid" x1="100" y1="346" x2="940" y2="346"/>
  <line class="grid" x1="100" y1="284" x2="940" y2="284"/>
  <line class="grid" x1="100" y1="223" x2="940" y2="223"/>
  <line class="grid" x1="100" y1="161" x2="940" y2="161"/>
  <line class="grid" x1="100" y1="100" x2="940" y2="100"/>

  <line class="axis" x1="100" y1="430" x2="940" y2="430"/>
  <line class="axis" x1="100" y1="80" x2="100" y2="430"/>

  <text class="tick" x="82" y="434" text-anchor="end">0</text>
  <text class="tick" x="82" y="411" text-anchor="end">20</text>
  <text class="tick" x="82" y="350" text-anchor="end">60</text>
  <text class="tick" x="82" y="288" text-anchor="end">100</text>
  <text class="tick" x="82" y="226" text-anchor="end">140</text>
  <text class="tick" x="82" y="165" text-anchor="end">180</text>
  <text class="tick" x="82" y="104" text-anchor="end">220</text>
  <text class="label" x="38" y="255" transform="rotate(-90 38 255)" text-anchor="middle">Security Findings</text>

  <!-- Scale: y = 430 - value * 1.35 -->
  <rect x="165" y="285.55" width="72" height="144.45" fill="url(#baselineHatch)"/>
  <rect x="247" y="342.25" width="72" height="87.75" fill="#69aee7"/>
  <text class="value" x="201" y="277">107</text>
  <text class="value" x="283" y="334">65</text>
  <text class="label" x="242" y="456" text-anchor="middle">OWASP-style</text>
  <text class="label" x="242" y="478" text-anchor="middle">(our templates)</text>

  <rect x="463" y="340.90" width="72" height="89.10" fill="url(#baselineHatch)"/>
  <rect x="545" y="393.55" width="72" height="36.45" fill="#69aee7"/>
  <text class="value" x="499" y="332">66</text>
  <text class="value" x="581" y="385">27</text>
  <text class="label" x="540" y="456" text-anchor="middle">SecurityEval</text>

  <rect x="761" y="103.30" width="72" height="326.70" fill="url(#baselineHatch)"/>
  <rect x="843" y="197.80" width="72" height="232.20" fill="#69aee7"/>
  <text class="value" x="797" y="95">242</text>
  <text class="value" x="879" y="189">172</text>
  <text class="label" x="838" y="456" text-anchor="middle">CyberSecEval</text>

  <rect x="285" y="512" width="28" height="16" fill="url(#baselineHatch)"/>
  <text class="legend" x="322" y="525">Without Project CodeGuard</text>
  <rect x="560" y="512" width="28" height="16" fill="#69aee7"/>
  <text class="legend" x="597" y="525">With Project CodeGuard</text>
  <text class="note" x="500" y="548" text-anchor="middle">Recreated from screenshot-visible totals; the source chart stacks ERROR and WARNING severity.</text>
</svg>
