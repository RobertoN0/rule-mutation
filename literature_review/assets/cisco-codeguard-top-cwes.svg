<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Top five CWEs by Project CodeGuard impact</title>
  <desc id="desc">Grouped bar chart showing findings before and after Project CodeGuard for CWE-120, CWE-327, CWE-798, CWE-020, and CWE-328.</desc>
  <style>
    .title { font: 700 26px Arial, sans-serif; fill: #2f3f55; }
    .axis { stroke: #d8dde5; stroke-width: 2; }
    .grid { stroke: #edf0f4; stroke-width: 1; }
    .tick { font: 14px Arial, sans-serif; fill: #2f3f55; }
    .label { font: 16px Arial, sans-serif; fill: #526b7d; }
    .value-red { font: 17px Arial, sans-serif; fill: #ff5f72; text-anchor: middle; }
    .value-teal { font: 17px Arial, sans-serif; fill: #45c9c3; text-anchor: middle; }
    .legend { font: 16px Arial, sans-serif; fill: #38485c; }
    .caption { font: 13px Arial, sans-serif; fill: #9aa9b5; }
  </style>

  <rect width="1000" height="600" fill="#ffffff"/>
  <text class="title" x="500" y="46" text-anchor="middle">Top 5 CWEs: Project CodeGuard Impact</text>

  <rect x="735" y="76" width="220" height="58" fill="#ffffff" stroke="#e3e7ed"/>
  <rect x="755" y="91" width="30" height="12" fill="#ff6172"/>
  <text class="legend" x="795" y="103">Without Project CodeGuard</text>
  <rect x="755" y="114" width="30" height="12" fill="#50d0c8"/>
  <text class="legend" x="795" y="126">With Project CodeGuard</text>

  <line class="grid" x1="100" y1="420" x2="940" y2="420"/>
  <line class="grid" x1="100" y1="357" x2="940" y2="357"/>
  <line class="grid" x1="100" y1="294" x2="940" y2="294"/>
  <line class="grid" x1="100" y1="231" x2="940" y2="231"/>
  <line class="grid" x1="100" y1="168" x2="940" y2="168"/>
  <line class="grid" x1="100" y1="105" x2="940" y2="105"/>

  <line class="axis" x1="100" y1="420" x2="940" y2="420"/>
  <line class="axis" x1="100" y1="105" x2="100" y2="420"/>

  <text class="tick" x="82" y="425" text-anchor="end">0</text>
  <text class="tick" x="82" y="362" text-anchor="end">10</text>
  <text class="tick" x="82" y="299" text-anchor="end">20</text>
  <text class="tick" x="82" y="236" text-anchor="end">30</text>
  <text class="tick" x="82" y="173" text-anchor="end">40</text>
  <text class="tick" x="82" y="110" text-anchor="end">50</text>
  <text class="label" x="42" y="265" transform="rotate(-90 42 265)" text-anchor="middle">Number of Findings</text>

  <!-- Scale: y = 420 - value * 6.3 -->
  <rect x="144" y="281.4" width="58" height="138.6" fill="#ff6172"/>
  <rect x="211" y="382.2" width="58" height="37.8" fill="#50d0c8"/>
  <text class="value-red" x="173" y="272">22</text>
  <text class="value-teal" x="240" y="373">6</text>
  <text class="label" x="206" y="448" text-anchor="middle">CWE-120</text>
  <text class="label" x="206" y="468" text-anchor="middle">Buffer</text>
  <text class="label" x="206" y="488" text-anchor="middle">Copy</text>

  <rect x="308" y="105" width="58" height="315" fill="#ff6172"/>
  <rect x="375" y="199.5" width="58" height="220.5" fill="#50d0c8"/>
  <text class="value-red" x="337" y="96">50</text>
  <text class="value-teal" x="404" y="190">35</text>
  <text class="label" x="370" y="448" text-anchor="middle">CWE-327</text>
  <text class="label" x="370" y="468" text-anchor="middle">Weak</text>
  <text class="label" x="370" y="488" text-anchor="middle">Crypto</text>

  <rect x="472" y="294" width="58" height="126" fill="#ff6172"/>
  <rect x="539" y="375.9" width="58" height="44.1" fill="#50d0c8"/>
  <text class="value-red" x="501" y="285">20</text>
  <text class="value-teal" x="568" y="367">7</text>
  <text class="label" x="534" y="448" text-anchor="middle">CWE-798</text>
  <text class="label" x="534" y="468" text-anchor="middle">Hardcoded</text>
  <text class="label" x="534" y="488" text-anchor="middle">Credentials</text>

  <rect x="636" y="357" width="58" height="63" fill="#ff6172"/>
  <rect x="703" y="401.1" width="58" height="18.9" fill="#50d0c8"/>
  <text class="value-red" x="665" y="348">10</text>
  <text class="value-teal" x="732" y="392">3</text>
  <text class="label" x="698" y="448" text-anchor="middle">CWE-020</text>
  <text class="label" x="698" y="468" text-anchor="middle">Input</text>
  <text class="label" x="698" y="488" text-anchor="middle">Validation</text>

  <rect x="800" y="319.2" width="58" height="100.8" fill="#ff6172"/>
  <rect x="867" y="350.7" width="58" height="69.3" fill="#50d0c8"/>
  <text class="value-red" x="829" y="310">16</text>
  <text class="value-teal" x="896" y="342">11</text>
  <text class="label" x="862" y="448" text-anchor="middle">CWE-328</text>
  <text class="label" x="862" y="468" text-anchor="middle">Weak</text>
  <text class="label" x="862" y="488" text-anchor="middle">Hash</text>

  <text class="caption" x="500" y="536" text-anchor="middle">Data from SecurityEval + CyberSecEval: 2,037 prompts from external benchmarks.</text>
</svg>
